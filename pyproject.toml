[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vara"
version = "0.1.0"
description = "Vector database debugger and visualizer — DB-agnostic tooling for RAG developers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Rahul Solanki", email = "rs069000@gmail.com" }]
keywords = ["vector-database", "rag", "debugging", "embeddings", "qdrant", "pinecone"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies — installed for every user regardless of DB choice
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "anyio>=4.3.0",
    "umap-learn>=0.5.12",
]

[project.optional-dependencies]
qdrant = [
    "qdrant-client>=1.8.0",
]
pinecone = [
    "pinecone-client>=3.2.0",
]
pgvector = [
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
]
milvus = [
    "pymilvus>=2.4.0",
]
viz = [
    "umap-learn>=0.5.6",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
]
eval = [
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-docker>=3.1.0",
    "vcrpy>=6.0.1",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "httpx>=0.27.0",
    # Type stubs
    "types-pyyaml>=6.0",
    "types-requests>=2.31",
]
all = [
    "vara[qdrant]",
    "vara[pinecone]",
    "vara[pgvector]",
    "vara[milvus]",
    "vara[viz]",
    "vara[eval]",
]

[project.scripts]
vara = "vara.cli:app"

[project.urls]
Homepage = "https://github.com/yourusername/vara"
Repository = "https://github.com/yourusername/vara"
Issues = "https://github.com/yourusername/vara/issues"

# ── Hatch (build) ────────────────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["vara"]

# Include the pre-built React UI in the wheel
[tool.hatch.build.targets.wheel.force-include]
"vara/server/static" = "vara/server/static"

# ── Ruff (lint + format) ─────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["vara"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ── Mypy (type checking) ──────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

# Strict on the core logic
[[tool.mypy.overrides]]
module = ["vara.core.*", "vara.adapters.*", "vara.config.*"]
strict = true
disallow_untyped_defs = true
disallow_any_generics = true

# Relaxed on server (FastAPI decorators confuse strict mypy)
[[tool.mypy.overrides]]
module = ["vara.server.*"]
disallow_untyped_defs = true
warn_return_any = false

# Ignore missing stubs for third-party packages
[[tool.mypy.overrides]]
module = [
    "qdrant_client.*",
    "pinecone.*",
    "pymilvus.*",
    "asyncpg.*",
    "pgvector.*",
    "umap.*",
    "sklearn.*",
]
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast, no external dependencies",
    "integration: requires running DB containers",
]
